<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Timeline</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffdede, #ffe5b4);
      color: #333;
      text-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .title {
      color: #ff6347;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .timeline {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      max-width: 600px;
      width: 90%;
    }

    .timeline li {
      margin: 15px 0;
      font-size: 18px;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 1s ease;
    }

    .btn {
      padding: 12px 25px;
      font-size: 18px;
      color: #fff;
      background: #ff6347;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      margin-top: 20px;
    }

    .btn:hover {
      background: #ff4500;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1 class="title">Our Love Timeline 🌟</h1>
  <ul class="timeline">
    <li><strong>8 years ago</strong> - Our First Meet</li>
    <li><strong>8 years ago</strong> - Our First Proposal</li>
    <li><strong>2024-12-31</strong> - Our First Date</li>
  </ul>
  <button class="btn" onclick="redirectToPromisePage()">Move to Promise 💖</button>

  <script>
    function redirectToPromisePage() {
      window.location.href = "promisepage.html";
    }
  </script>
</body>
</html>
