<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Our Love Story</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffdede, #ffe5b4);
      color: #333;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .title {
      color: #ff6347;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .intro-text {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 25px;
      font-size: 18px;
      color: #fff;
      background: #ff6347;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn:hover {
      background: #ff4500;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .hearts {
      font-size: 36px;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 class="title">Welcome to Our Love Story Baachi💕</h1>
  <p class="intro-text">
    Dive into the magical journey of our love. <br>
    Celebrate <span class="highlight">Promise Day</span> with joy, memories, and heartfelt promises! 💖
  </p>
  <p class="intro-text hearts">❤️ 💛 💙</p>
  <button class="btn" onclick="redirectToPromiseDay()">Start the Journey 💖</button>

  <script>
    function redirectToPromiseDay() {
      window.location.href = "promise-day.html";
    }
  </script>
</body>
</html>
