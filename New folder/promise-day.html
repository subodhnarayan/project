<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Promise Day</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffdede, #ffe5b4);
      color: #333;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    .title {
      color: #ff6347;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .highlight {
      font-size: 18px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .promise-list {
      list-style: none;
      padding: 0;
      margin-bottom: 30px;
    }

    .promise-list li {
      margin: 10px 0;
      font-size: 18px;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      display: inline-block;
      width: 80%;
    }

    .btn {
      padding: 12px 25px;
      font-size: 18px;
      color: #fff;
      background: #ff6347;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn:hover {
      background: #ff4500;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .hearts {
      font-size: 36px;
      margin: 20px 0;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>
  <h1 class="title">Happy Promise Day! Baachi 💌</h1>
  <p class="highlight">Here are my heartfelt promises to you:</p>
  <ul class="promise-list">
    <li>🤝 I promise to always support you.</li>
    <li>🥰 I promise to make you smile every day.</li>
    <li>❤️ I promise to love you forever.</li>
  </ul>
  <div class="hearts">💕 💖 💕</div>
  <button class="btn" onclick="redirectToTimeline()">View Our Love Timeline 🌟</button>

  <script>
    function redirectToTimeline() {
      window.location.href = "timeline.html";
    }
  </script>
</body>
</html>
